name: Update now playing

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Optional PUSH_TOKEN secret (fine-grained PAT with contents: write) if GitHub Pages
          # does not redeploy after commits made with the default token.
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest track from Apple Music
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
        run: node tools/update-now-playing.mjs

      - name: Update the radio station
        continue-on-error: true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
        run: node tools/update-radio.mjs

      - name: Commit and push if anything changed
        run: |
          for f in now-playing.json radio.json radio-index.json radio-token.json spotify-index.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          MSG=""
          if ! git diff --cached --quiet -- now-playing.json; then
            MSG="Now playing: $(node -p "const t=require('./now-playing.json'); t.song + ' — ' + t.artist")"
          fi
          if ! git diff --cached --quiet -- radio.json; then
            R="Radio: $(node -p "require('./radio.json').station.name")"
            MSG="${MSG:+$MSG · }$R"
          fi
          [ -n "$MSG" ] || MSG="Radio: refresh index and token"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
