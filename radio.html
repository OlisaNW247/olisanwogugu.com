<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Olisa’s Radio — Olisa Nwogugu</title>
  <meta name="description" content="A 24/7 radio station built from whichever playlist Olisa Nwogugu last played. Listen on Apple Music or Spotify.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Olisa Nwogugu">
  <link rel="canonical" href="https://olisanwogugu.com/radio.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Olisa Nwogugu">
  <meta property="og:title" content="Olisa’s Radio">
  <meta property="og:description" content="A 24/7 station built from whichever playlist Olisa last played. Listen on Apple Music or Spotify.">
  <meta property="og:url" content="https://olisanwogugu.com/radio.html">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/radio.css">
</head>
<body>
  <div class="rd-backdrop" id="rd-back"></div>
  <div class="rd-vignette"></div>
  <div class="rd-grain"></div>
  <div class="rd-bar rd-bar-top"></div>
  <div class="rd-bar rd-bar-bottom"></div>

  <a class="rd-home" href="/">&larr; Olisa Nwogugu</a>
  <div class="rd-onair" id="rd-onair"><span class="dot"></span><span>On air</span></div>

  <!-- Choose how to listen: one half each -->
  <section class="rd-choose" id="rd-choose">
    <button class="rd-half rd-half-apple" id="rd-pick-apple" type="button">
      <span class="rd-half-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 36V14l18-4v22"/><circle cx="13" cy="36" r="5"/><circle cx="31" cy="32" r="5"/></svg>
      </span>
      <span class="rd-half-name">Apple Music</span>
    </button>
    <button class="rd-half rd-half-spotify" id="rd-pick-spotify" type="button">
      <span class="rd-half-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="24" cy="24" r="19"/><path d="M14 19c7-2 15-1.5 21 2M15.5 25c6-1.5 12-1 17 2M17 31c4.5-1 9-.7 13 1.5"/></svg>
      </span>
      <span class="rd-half-name">Spotify</span>
    </button>
    <p class="rd-choose-hint" id="rd-choose-hint" hidden></p>
  </section>

  <main class="rd-stage" id="rd-stage" hidden>
    <div class="rd-frame"><div class="rd-art" id="rd-art"></div></div>
    <h1 class="rd-title" id="rd-title"></h1>
    <p class="rd-station" id="rd-station" hidden></p>
    <p class="rd-artist" id="rd-artist" hidden></p>
  </main>

  <div class="rd-dock" id="rd-dock" hidden>
    <div class="rd-progress"><div id="rd-progress"></div></div>
    <div class="rd-controls">
      <button class="rd-btn" id="rd-start" type="button" hidden>Start listening</button>
      <button class="rd-icon" id="rd-play" type="button" aria-label="Play" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="rd-icon" id="rd-pause" type="button" aria-label="Pause" hidden><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <input class="rd-volume" id="rd-volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" hidden>
    </div>
    <p class="rd-status" id="rd-status"></p>
    <p class="rd-meta">
      <span class="rd-source" id="rd-source"></span>
      <a class="rd-link" id="rd-link" target="_blank" rel="noopener" hidden>Open song &rarr;</a>
      <a class="rd-link" id="rd-login" target="_blank" rel="noopener" href="https://accounts.spotify.com/login?continue=https%3A%2F%2Fopen.spotify.com%2F" hidden>Log in to Spotify &rarr;</a>
      <button class="rd-switch" id="rd-switch" type="button">Switch service</button>
    </p>
  </div>

  <div class="rd-embed" id="rd-embed" hidden><div id="rd-embed-slot"></div></div>

  <script src="/radio.js"></script>
</body>
</html>
